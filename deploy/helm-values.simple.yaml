# Simple values for deploy/helm/sub2api.
# This file is intentionally small. Full defaults live in
# deploy/helm/sub2api/values.yaml.

global:
  imageRegistry: ""
  defaultStorageClass: ""
  security:
    allowInsecureImages: false

image:
  repository: weishaw/sub2api
  tag: latest

waitForDependencies:
  enabled: true
  timeoutSeconds: 300

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

persistence:
  enabled: true
  size: 10Gi

app:
  runMode: standard
  timezone: Asia/Shanghai
  adminEmail: admin@sub2api.local
  update:
    # Set to http://127.0.0.1:7890 when mihomo sidecar is enabled and the
    # cluster needs proxy access for GitHub release checks or pricing downloads.
    proxyURL: ""

postgresql:
  enabled: true
  auth:
    # Set this before the first install. PostgreSQL bakes the password into
    # its data directory at initdb time, but the Secret holding it is created
    # fresh on every install. Left empty, Bitnami generates a random password,
    # so reinstalling over a retained PVC fails with:
    #   password authentication failed for user "sub2api"
    # Generate one with: openssl rand -hex 24
    password: ""
  primary:
    persistence:
      enabled: true
      size: 20Gi

redis:
  enabled: true
  auth:
    # Same as postgresql.auth.password above: set this before the first
    # install so a reinstall over a retained PVC still authenticates.
    password: ""
  master:
    persistence:
      enabled: true
      size: 8Gi

# Optional mihomo sidecar. It exposes a local proxy inside the Sub2API Pod.
# For Sub2API's built-in GitHub/pricing downloads, also set:
# app.update.proxyURL: http://127.0.0.1:7890
# For provider/account traffic, configure Sub2API's in-app proxy after install.
mihomo:
  enabled: false
  config:
    existingSecret: ""
    key: config.yaml
